name: GrandNode Docker Release

on:
  # Production release:
  # git tag 2.3.0
  # git push origin 2.3.0
  push:
    tags:
      - '*.*.*'

  # Manual build/test
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version, e.g. 2.3.0-test'
        required: true
        type: string
        default: '2.3.0-test'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grandnode/grandnode2

jobs:
  release:
    name: Build, Sign, SBOM and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            RELEASE_TYPE="manual"
          else
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_TYPE="tag"
          fi

          # Docker tag / SemVer-like validation.
          # Examples:
          # 2.3.0
          # 2.3.0-test
          # 2.3.0-test.1
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            echo "Expected format: X.Y.Z or X.Y.Z-suffix"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TYPE=$RELEASE_TYPE" >> "$GITHUB_ENV"

          echo "Release type: $RELEASE_TYPE"
          echo "Release version: $VERSION"

      - name: Determine Cosign certificate identity
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CERTIFICATE_IDENTITY="https://github.com/grandnode/grandnode2/.github/workflows/docker-release.yml@refs/heads/${GITHUB_REF_NAME}"
          else
            CERTIFICATE_IDENTITY="https://github.com/grandnode/grandnode2/.github/workflows/docker-release.yml@refs/tags/${VERSION}"
          fi

          echo "CERTIFICATE_IDENTITY=$CERTIFICATE_IDENTITY" >> "$GITHUB_ENV"

          echo "Cosign certificate identity:"
          echo "$CERTIFICATE_IDENTITY"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

          labels: |
            org.opencontainers.image.source=https://github.com/grandnode/grandnode2
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=GrandNode Docker release ${{ env.VERSION }}

          # BuildKit attestations
          sbom: true
          provenance: mode=max

          # GitHub Actions BuildKit cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Show release information
        run: |
          echo "========================================"
          echo "GrandNode Docker Release"
          echo "========================================"

          echo "Release type:"
          echo "${RELEASE_TYPE}"

          echo "Version:"
          echo "${VERSION}"

          echo "Git ref:"
          echo "${GITHUB_REF}"

          echo "Git commit:"
          echo "${GITHUB_SHA}"

          echo "Docker image:"
          echo "${REGISTRY}/${IMAGE_NAME}:${VERSION}"

          echo "Docker digest:"
          echo "${{ steps.build.outputs.digest }}"

          echo "Cosign certificate identity:"
          echo "${CERTIFICATE_IDENTITY}"

          echo "========================================"

      - name: Cosign keyless sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign \
            --yes \
            "${IMAGE}@${DIGEST}"

      - name: Cosign keyless verify
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            "${IMAGE}@${DIGEST}" \
            --certificate-identity="${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Verify SBOM attestation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            "${IMAGE}@${DIGEST}" \
            --certificate-identity="${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --type spdx

      - name: Verify SLSA provenance attestation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            "${IMAGE}@${DIGEST}" \
            --certificate-identity="${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --type slsaprovenance
