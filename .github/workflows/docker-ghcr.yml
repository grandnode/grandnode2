name: GrandNode Docker GHCR

on:
  push:
    branches:
      - test/ghcr-private

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grandnode/grandnode2
  VERSION: test

jobs:
  release:
    name: Build, Sign, SBOM and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

          labels: |
            org.opencontainers.image.source=https://github.com/grandnode/grandnode2
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=GrandNode Docker test image

          # BuildKit native attestations
          sbom: true
          provenance: mode=max

          # GitHub Actions BuildKit cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Show release information
        run: |
          echo "========================================"
          echo "GrandNode Docker Test"
          echo "========================================"

          echo "Image:"
          echo "${REGISTRY}/${IMAGE_NAME}:${VERSION}"

          echo "Git ref:"
          echo "${GITHUB_REF}"

          echo "Git commit:"
          echo "${GITHUB_SHA}"

          echo "Docker digest:"
          echo "${{ steps.build.outputs.digest }}"

          echo "========================================"

      - name: Cosign keyless sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign \
            --yes \
            "${IMAGE}@${DIGEST}"

      - name: Cosign keyless verify
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/grandnode/grandnode2/.github/workflows/docker-ghcr.yml@refs/heads/.*"

      - name: Verify SBOM attestation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            "${IMAGE}@${DIGEST}" \
            --type spdx \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/grandnode/grandnode2/.github/workflows/docker-ghcr.yml@refs/heads/.*"

      - name: Verify SLSA provenance attestation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            "${IMAGE}@${DIGEST}" \
            --type slsaprovenance \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/grandnode/grandnode2/.github/workflows/docker-ghcr.yml@refs/heads/.*"
