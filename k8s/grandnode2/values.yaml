replicaCount: 3

image:
  repository: "my-ecr-or-dockerhub/grandnode2" # TODO: Replace with your image repository.
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  host: "grandnode2.example.com" # TODO: Replace with your real domain.
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  DB_CONNECTION_STRING: "Server=REPLACE_ME;Database=REPLACE_ME;User Id=REPLACE_ME;Password=REPLACE_ME;"
